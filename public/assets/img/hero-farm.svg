    <clipPath id="frame"><rect x="0" y="0" width="480" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="480" height="320" fill="url(#sky)"/>

    <!-- sol -->
    <circle cx="96" cy="78" r="34" fill="#f4c945"/>

    <!-- nuvens -->
    <g fill="#ffffff" opacity="0.92">
      <ellipse cx="330" cy="70" rx="40" ry="20"/>
      <ellipse cx="360" cy="60" rx="28" ry="18"/>
      <ellipse cx="300" cy="62" rx="24" ry="16"/>
      <ellipse cx="180" cy="110" rx="30" ry="15"/>
      <ellipse cx="205" cy="104" rx="22" ry="13"/>
