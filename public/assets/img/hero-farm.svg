    </g>

    <!-- boi -->
    <g fill="#2f7d27" transform="translate(60 214) scale(0.55)">
      <rect x="36" y="58" width="8" height="28" rx="4"/>
      <rect x="52" y="58" width="8" height="28" rx="4"/>
      <rect x="82" y="58" width="8" height="28" rx="4"/>
      <rect x="98" y="58" width="8" height="28" rx="4"/>
      <ellipse cx="66" cy="48" rx="46" ry="23"/>
      <circle cx="104" cy="44" r="16"/>
      <ellipse cx="118" cy="50" rx="8" ry="6.5"/>
      <path d="M100 28 q-5 -11 -12 -9 q5 3 7 12 z"/>
      <path d="M112 28 q6 -10 12 -7 q-6 3 -7 11 z"/>
