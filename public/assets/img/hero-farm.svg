    <path d="M0 250 C90 220 200 268 300 244 C380 226 440 258 480 242 L480 320 L0 320 Z" fill="#57b04a"/>
    <path d="M0 292 C120 270 230 300 340 286 C400 278 450 296 480 288 L480 320 L0 320 Z" fill="#3f9a35"/>

    <!-- cerca -->
    <g fill="#2f7d27">
