<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    # a spa é servida na raiz; as rotas da api caem no front controller
    DirectoryIndex index.html index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # tudo que não for arquivo existente cai no front controller do Slim
        FallbackResource /index.php

        # arquivos estáticos não passam pelo Slim, então os cabeçalhos de segurança saem aqui também; os valores espelham o SecurityHeadersMiddleware
        Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
